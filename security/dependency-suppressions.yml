# Accepted vulnerable-dependency findings — Track 7 milestone 7.2.1.
#
# Every entry here is a known-vulnerable package that CI is told not to fail on, and every entry
# **expires**. That is the load-bearing part of the design: a permanent suppression is a decision
# nobody revisits, and a suppression file full of them is indistinguishable from having no gate. On
# the expiry date the scan starts failing again and somebody has to either fix it or consciously
# renew the acceptance — which is the same risk-acceptance-with-an-expiry-date discipline NetRisk
# ships as a product feature (Track 3 milestone 3.2.3).
#
# Rules, enforced by scripts/security/scan-dependencies.sh:
#   * `expires` is required, ISO-8601, and must be in the future. A past date makes the scan fail.
#   * `expires` may be at most 180 days out. A longer acceptance is a remediation plan, not a
#     suppression, and belongs in docs/security/FINDINGS.md.
#   * `reason` and `owner` are required. "Not exploitable" without saying why is not a reason.
#   * `advisory` names the GHSA/CVE so the entry can be matched to what the scanner reports.
#
# The file is deliberately empty. `dotnet list package --vulnerable --include-transitive` reported
# nothing across all 33 projects at the Track 7 baseline (2026-08-26), so there is nothing to accept.

suppressions: []
# Example of the shape an entry takes — commented out, because an example that parses as data is how
# a suppression file acquires a suppression nobody added on purpose:
#
# suppressions:
#   - package: SomePackage
#     version: "1.2.3"
#     advisory: GHSA-xxxx-yyyy-zzzz
#     severity: moderate
#     reason: >
#       The vulnerable code path is the XML deserializer, which NetRisk never reaches — the only
#       call site is SomeService.Parse, which uses the streaming API. Upstream fix lands in 1.3.0,
#       which needs the .NET 11 target we are not on yet.
#     owner: security@netrisk.app
#     finding: NR-2026-0xx
#     expires: 2026-12-31
