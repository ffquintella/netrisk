  - phase: "11"
    description: >-
      Phase 11 — Track 8 governance core. Three new tables (risk_appetites, audit_logs,
      mitigation_tasks) plus columns on seven existing ones: risk-level acceptance on
      risk_acceptances, residual and FAIR-lite quantitative scoring on risk_scoring and
      risk_scoring_history, counter-signature on mgmt_reviews, business rank and event-triggered
      review flags on risks, triage state on the previously dead pending_risks table, and written
      definitions with numeric bounds on the likelihood and impact scales. Purely additive — nothing
      is dropped, renamed or retyped. The Data half re-creates the `next_review_date_uses` setting
      (deleted in version 29) with the value that preserves today's cadence behaviour, and turns on
      the workflow state machine and segregation of duties, which is the intended behaviour change:
      the finding those close is that convention was doing the work of enforcement.
    startVersion: 79
    targetVersion: 80
    destructive: false
    census:
