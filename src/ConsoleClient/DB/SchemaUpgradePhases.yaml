  - phase: "14"
    description: >-
      Phase 14 — Track 4 milestone 4.6, Jira Service Management and Assets. Eight additive tables
      (the connection's Jira facet and its queue selection, the customer-request mirror and its SLA
      cycles, the Jira field mapping, the Assets object and attribute mappings, and the imported
      register with its audit), two CMDB columns on hosts (environment, owner), and the widening of
      finding_issue_links from findings to findings, incidents and risks. The widening is what makes
      this phase interesting: vulnerability_id becomes nullable and gains incident_id and risk_id
      siblings plus a target_kind that defaults to 1 (Finding), so every existing row reads correctly
      with no backfill, and a CHECK constraint holds the "exactly one target" invariant that
      FindingIssueLink.Validate() also enforces in code. Nothing is dropped and nothing is renamed.
    startVersion: 82
    targetVersion: 83
    destructive: false
    census:
