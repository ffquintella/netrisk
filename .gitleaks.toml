# gitleaks configuration — Track 7 milestones 7.3.3 and 7.5.1.
#
# The baseline finding this exists to prevent recurring is NR-2026-003: TLS private keys committed
# under src/{API,WebSite}/Certificates, referenced by the shipped appsettings.json with the password
# "pass". Those specific files are self-signed, expired since 2023 and worthless, so they stay in
# history rather than being force-pushed away — but the scanner has to keep finding *new* ones, which
# is why the allowlist below names paths precisely instead of ignoring "*.pfx".

title = "NetRisk"

[extend]
# The upstream rule set, which covers the cloud providers, the token formats and the private-key
# headers. Extended rather than replaced: a hand-written rule list only ever finds what its author
# thought of.
useDefault = true

# ---------------------------------------------------------------------------------------------
# NetRisk-specific rules
# ---------------------------------------------------------------------------------------------

[[rules]]
id = "netrisk-api-token"
description = "NetRisk CI API token (nrk_ prefix, Track 3 milestone 3.5.1)"
# ApiTokensService.Compose issues `nrk_<16 lowercase hex><_><base64url of 32 bytes>` — the key id is
# Convert.ToHexString(RandomNumberGenerator.GetBytes(8)).ToLowerInvariant(). Matching that shape
# rather than "nrk_ plus 20 word characters" is what keeps the rule off `nrk_something_table_name`.
regex = '''nrk_[0-9a-f]{16}_[A-Za-z0-9_\-]{32,}'''
keywords = ["nrk_"]

[[rules]]
id = "netrisk-scim-token"
description = "NetRisk SCIM provisioning token (scim_ prefix, Track 4 milestone 4.3.2)"
# Same shape as the API token — ScimService.Compose. The loose form of this rule matched the schema
# itself (`scim_tokens_identity_provider_id`, `scim_request_logs_occurred_at`), 72 findings of it.
regex = '''scim_[0-9a-f]{16}_[A-Za-z0-9_\-]{32,}'''
keywords = ["scim_"]

[[rules]]
id = "netrisk-db-connection-password"
description = "A database password inside a connection string"
# Two exclusions, both expressed in the pattern itself because gitleaks compiles with RE2 and RE2
# has no lookahead:
#   * the Puppet templates, whose value is an <%= %> interpolation — the value class excludes "<",
#     so such a value cannot start one;
#   * assignments. A connection-string keyword is written `pwd=value`; `password = expr` with spaces
#     around the equals sign is code, and matching it (`$db_password = String(file(...))`,
#     `password = HttpUtility.UrlEncode(password)`) was this rule's largest source of noise.
regex = '''(?i)(?:pwd|password)=[^;<>"'\s]{4,}'''
keywords = ["pwd=", "password="]
[rules.allowlist]
regexTarget = "match"
regexes = [
  # The placeholder in the documented example connection strings.
  '''(?i)(pwd|password)\s*=\s*(\.\.\.|changeme|xxx+|your[-_]?password|\$\{[^}]+\})''',
]

[[rules]]
id = "netrisk-certificate-password"
description = "A certificate password in an appsettings file"
# The value must hold at least one non-whitespace character, so that an empty or blank password
# is not a finding. Written without a lookahead because gitleaks compiles with RE2.
regex = '''"[Pp]assword"\s*:\s*"\s*[^"\s][^"]{0,63}"'''
keywords = ["password"]
[rules.allowlist]
paths = [
  # The Puppet templates interpolate, so their "password" value is a token not a secret.
  '''build/puppet/modules/netrisk/templates/.*\.epp$''',
]

# ---------------------------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------------------------
[allowlist]
description = "Reviewed, deliberate matches"

paths = [
  # The committed development certificates (finding NR-2026-003). Self-signed, expired 2023, and
  # the running application refuses to serve with them outside a Debug build. Named file by file so
  # that a *new* key under the same directory is still reported.
  '''^src/API/Certificates/certificate\.(pem|pfx)$''',
  '''^src/API/Certificates/csr\.csr$''',
  '''^src/API/Certificates/demowebapp\.local\.pfx$''',
  '''^src/API/Certificates/key\.pem$''',
  '''^src/API/Certificates/localhost\.(cer|key|pfx)$''',
  '''^src/API/Certificates/stubidp\.sustainsys\.com\.cer$''',
  '''^src/WebSite/Certificates/certificate\.(pem|pfx)$''',
  '''^src/WebSite/Certificates/demowebapp\.local\.pfx$''',
  '''^src/WebSite/Certificates/key\.pem$''',
  '''^src/WebSite/Certificates/localhost\.(cer|key|pfx)$''',
  '''^src/WebSite/Certificates/stubidp\.sustainsys\.com\.cer$''',

  # Test fixtures: keys and tokens generated for a single test run.
  '''^src/[A-Za-z.]+\.Tests/.*$''',
  '''^src/DAL\.IntegrationTests/.*$''',

  # Documentation that quotes credential *shapes* so a reader recognises one.
  '''^docs/security/.*\.md$''',
  '''^docs/.*\.md$''',
  '''^CLAUDE\.md$''',
  # The READMEs carry the same `dotnet user-secrets set "Database:ConnectionString" "…pwd=JDHFI…"`
  # example as the docs tree — a shape to recognise, not a credential that opens anything.
  '''(^|/)README\.md$''',
  # The changelog, for the same reason and by demonstration: the entry describing this rule's own
  # repair quotes the `pwd=value` form it matches on, and tripped it.
  '''^CHANGELOG\.md$''',
]

regexes = [
  # The user-secrets example in the documentation and CLAUDE.md.
  '''pwd=\.\.\.''',
  # The .NET user-secrets identifier, which is a GUID and not a secret.
  '''<UserSecretsId>[0-9a-fA-F-]{36}</UserSecretsId>''',
  # SecretProtector's key label. It is the *name* of the key in the protector's keyring, written to
  # every encrypted blob as a version marker, and upstream's generic-api-key rule reads the
  # assignment as a credential.
  '''netrisk\.integrations\.secret\.v1''',
]
